# F5's maintained controller with NGINX Open Source, not kubernetes/ingress-nginx.
# Platform prerequisite, separate from application release bundles.
# Requires Flux source/helm controllers. See README.md#ingress-controller.
apiVersion: v1
kind: Namespace
metadata:
  name: nginx-ingress
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: nginx
  namespace: nginx-ingress
spec:
  interval: 1h
  url: https://helm.nginx.com/stable
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nginx-ingress
  namespace: nginx-ingress
spec:
  interval: 10m
  releaseName: nginx-ingress
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  chart:
    spec:
      chart: nginx-ingress
      version: 2.7.1
      sourceRef:
        kind: HelmRepository
        name: nginx
      interval: 1h
  values:
    controller:
      nginxplus: false
      replicaCount: 2
      image:
        repository: nginx/nginx-ingress
        tag: 5.6.1
      ingressClass:
        # Coexist with an older controller that already owns class "nginx".
        name: medw-nginx
        create: true
        setAsDefaultIngress: false
      watchNamespace: medw,nginx-ingress
      watchSecretNamespace: medw,nginx-ingress
      enableCustomResources: true
      # Required for the checked-in auth-header overrides. Only trusted
      # deployment operators may edit Ingress/VirtualServer/Policy resources.
      enableSnippets: true
      config:
        entries:
          # Auth subrequests use these defaults; data upstreams override read
          # timeout to allow long streams without lengthening auth failures.
          proxy-connect-timeout: 3s
          proxy-read-timeout: 10s
      telemetryReporting:
        enable: false
      reportIngressStatus:
        enable: true
        enableLeaderElection: true
      service:
        type: LoadBalancer
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          memory: 512Mi
