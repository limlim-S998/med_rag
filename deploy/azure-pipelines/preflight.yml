# Run before commissioning paid Azure infrastructure. No Azure service connection.
trigger: none
pr: none
parameters:
  - name: agentPool
    type: string
    default: ''
jobs:
  - job: build_capacity
    pool:
      ${{ if eq(parameters.agentPool, '') }}:
        vmImage: ubuntu-latest
      ${{ else }}:
        name: ${{ parameters.agentPool }}
    steps:
      - checkout: self
        persistCredentials: true
        fetchDepth: 1
      - bash: |
          set -euo pipefail
          docker info --format '{{.ServerVersion}}'
          python3 --version
          git --version
          case "$BUILD_SOURCEBRANCH" in
            refs/heads/medw-preflight-*) ;;
            *) echo "Refusing to write outside the disposable probe branch"; exit 1 ;;
          esac
          git config user.name 'Azure Pipelines capacity probe'
          git config user.email 'medwriter-pipeline@users.noreply.github.com'
          echo "$BUILD_BUILDID" > .medw-capacity-probe
          git add .medw-capacity-probe
          git commit -m 'Verify pipeline release-commit credentials [skip ci]'
          git push origin "HEAD:$BUILD_SOURCEBRANCH"
        displayName: Verify build capacity and repository write access before Azure spending
