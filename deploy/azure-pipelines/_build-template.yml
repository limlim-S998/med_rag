# One release contains five API/worker images and the Airflow DAG image.
parameters:
  - name: registryHost
    type: string
    default: medwdevacr.azurecr.io
  - name: azureConnection
    type: string
    default: medw-deployment
  - name: agentPool
    type: string
    default: ''
  - name: buildConcurrency
    type: number
    default: 2
    values: [1, 2]
  - name: releaseBranch
    type: string
    default: main

stages:
  - stage: build
    jobs:
      - job: all_images
        pool:
          ${{ if eq(parameters.agentPool, '') }}:
            vmImage: ubuntu-latest
          ${{ else }}:
            name: ${{ parameters.agentPool }}
        steps:
          - checkout: self
            persistCredentials: true
            fetchDepth: 0
          - task: UsePythonVersion@0
            inputs: { versionSpec: '3.11' }
          - task: HelmInstaller@1
            inputs: { helmVersionToInstall: '3.19.0' }
          - task: KubectlInstaller@0
            inputs: { kubectlVersion: '1.32.2' }
          - script: |
              set -euo pipefail
              python -m pip install -r requirements-dev.txt
              make lint arch types test charts
            displayName: Check code, contracts and deployment manifests
          - task: AzureCLI@2
            inputs:
              azureSubscription: ${{ parameters.azureConnection }}
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail
                az acr login --name '${{ parameters.registryHost }}'
                python scripts/build_images.py --registry '${{ parameters.registryHost }}' --jobs '${{ parameters.buildConcurrency }}' --push --output /tmp/images.json
                python scripts/release.py create --images /tmp/images.json --behavior deploy/release-behavior.json --output /tmp/bundle.json
                python scripts/verify_release.py /tmp/bundle.json --registry '${{ parameters.registryHost }}' --environment dev
            displayName: Build, smoke, publish and verify exact artifacts
          - publish: /tmp/bundle.json
            artifact: release

  - stage: validate_models
    dependsOn: build
    jobs:
      - job: installed_implementations
        pool:
          ${{ if eq(parameters.agentPool, '') }}:
            vmImage: ubuntu-latest
          ${{ else }}:
            name: ${{ parameters.agentPool }}
        steps:
          - checkout: self
          - download: current
            artifact: release
          - script: |
              set -euo pipefail
              python -m pip install pyyaml==6.0.2
              PYTHONPATH=libs python scripts/check_model_deployments.py '$(Pipeline.Workspace)/release/bundle.json' --environment dev
            displayName: Verify installed model identity and target infrastructure

  - stage: migrate
    dependsOn: validate_models
    jobs:
      - job: sql_migrations
        pool:
          ${{ if eq(parameters.agentPool, '') }}:
            vmImage: ubuntu-latest
          ${{ else }}:
            name: ${{ parameters.agentPool }}
        steps:
          - checkout: self
          - download: current
            artifact: release
          - task: AzureCLI@2
            inputs:
              azureSubscription: ${{ parameters.azureConnection }}
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail
                az acr login --name '${{ parameters.registryHost }}'
                export MEDW_SQL_ACCESS_TOKEN="$(az account get-access-token --resource https://database.windows.net/ --query accessToken -o tsv)"
                python scripts/run_migrations_image.py --bundle '$(Pipeline.Workspace)/release/bundle.json' --registry '${{ parameters.registryHost }}'
                unset MEDW_SQL_ACCESS_TOKEN
            env:
              MEDW_SQL_SERVER: $(sqlServer)
              MEDW_SQL_DATABASE: $(sqlDatabase)
            displayName: Apply tracked migrations with federated deployment identity

  - stage: promote_to_dev
    dependsOn: migrate
    condition: succeeded()
    jobs:
      - job: commit_release
        pool:
          ${{ if eq(parameters.agentPool, '') }}:
            vmImage: ubuntu-latest
          ${{ else }}:
            name: ${{ parameters.agentPool }}
        steps:
          - checkout: self
            persistCredentials: true
            fetchDepth: 0
          - download: current
            artifact: release
          - script: |
              set -euo pipefail
              python -m pip install pyyaml==6.0.2
              python scripts/commit_release.py '$(Pipeline.Workspace)/release/bundle.json' --environment dev --branch '${{ parameters.releaseBranch }}' --push
            env:
              PYTHONPATH: libs
            displayName: Select release in Git after successful migrations
