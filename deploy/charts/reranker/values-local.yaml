image:
  repository: medw-reranker
  tag: dev
  pullPolicy: Never
serviceAccount:
  annotations: {}
autoscaling:
  enabled: false
replicas: 1
resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi
env: local
localState:
  enabled: true
  existingClaim: medw-local-state
config:
  local_state_path: /data/platform.sqlite3
  local_artifact_dir: /data/artifacts
