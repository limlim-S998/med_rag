# Deterministic lexical reranking; future model weights stay behind the same HTTP API.
name: reranker
env: dev
replicas: 2

image:
  # Code and implementation identity are captured by the image digest/source SHA.
  repository: medwdevacr.azurecr.io/reranker
  digest: ""
  sourceSha: unversioned
  tag: scaffold

serviceAccount:
  annotations:
    # It calls nothing in Azure. The identity exists for consistency of the
    # template, and it holds no role assignments at all.
    azure.workload.identity/client-id: ""

config: {}

resources:
  # Azure exercise configuration sets small requests and at most two replicas.
  requests: { cpu: "1",  memory: 2Gi }
  limits:   { cpu: "2",  memory: 3Gi }

autoscaling:
  enabled: true
  metric: cpu           # the one service where CPU autoscaling is the right signal
  target: 70
  minReplicas: 2
  maxReplicas: 6

startupProbe:
  # Retain a startup window for later weight loading; the current model is immediate.
  initialDelaySeconds: 0
  failureThreshold: 20
