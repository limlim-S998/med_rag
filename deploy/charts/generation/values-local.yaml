image:
  repository: medw-generation
  tag: dev
  pullPolicy: Never
serviceAccount:
  annotations: {}
autoscaling:
  enabled: true
  metric: inflight_requests
  target: 2
  minReplicas: 1
  maxReplicas: 4
  prometheusAddress: http://kps-kube-prometheus-stack-prometheus.monitoring:9090
serviceMonitor:
  enabled: true
  interval: 5s
replicas: 1
resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi
config:
  backend: local
  local_state_path: /data/platform.sqlite3
  local_artifact_dir: /data/artifacts
env: local
localState:
  enabled: true
  existingClaim: medw-local-state
