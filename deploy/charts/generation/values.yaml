# Generation: HTTP retrieval, streamed placeholder output and SQL audit.
name: generation
env: dev
replicas: 2

image:
  repository: medwdevacr.azurecr.io/generation
  digest: ""
  sourceSha: unversioned
  tag: scaffold

serviceAccount:
  annotations:
    # This service appends SQL audit and reads retained source evidence.
    azure.workload.identity/client-id: ""

config:
  cosmos_state_container: "platform-state"
  blob_account_url: ""
  blob_container: "raw"
  # --- the model axis ---------------------------------------------------
  chat_deployment: scripted-chat
  embed_version: hash-1
  prompt_bundle_sha: local-dev        # SHA of app/prompts/, into every audit row
  temperature: "0"                  # not creative writing. Pinned, not defaulted.

  # Filled by the Azure deployment configuration.
  sql_server: ""
  sql_database: medw
  cosmos_endpoint: ""
  cosmos_database: medw

resources:
  requests: { cpu: 200m, memory: 512Mi }
  limits:   { cpu: "1",  memory: 1Gi }

autoscaling:
  enabled: true
  metric: inflight_requests
  target: 10
  minReplicas: 2
  # Azure exercise configuration overrides the ceiling to two replicas.
  maxReplicas: 8

# Permit NGINX's authenticated requests; the gateway chart owns public routes.
ingress:
  enabled: true
  controller:
    namespace: nginx-ingress
    podLabels:
      app.kubernetes.io/name: nginx-ingress
