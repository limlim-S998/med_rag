{{/*
StatefulSet, not Deployment, and the reason is the identity of the storage:
each replica needs its own PVC that follows it across rescheduling, and a
stable network name so peers can find each other. A Deployment gives you
neither - pods are interchangeable, which is exactly what a shard is not.
*/}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: qdrant
spec:
  # Must be the HEADLESS service, not the ClusterIP one. This is what gives
  # each pod its stable per-pod DNS name; pointing it at the load-balanced
  # Service silently breaks peer discovery while everything still "runs".
  serviceName: qdrant-headless
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels: { app: qdrant }
  template:
    metadata:
      labels: { app: qdrant }
    spec:
      containers:
        - name: qdrant
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          ports:
            - { containerPort: 6333, name: http }
            - { containerPort: 6334, name: grpc }
            - { containerPort: 6335, name: p2p }
          env:
            - name: QDRANT__STORAGE__ON_DISK_PAYLOAD
              value: {{ .Values.config.on_disk_payload | quote }}
          readinessProbe:
            httpGet: { path: /readyz, port: 6333 }
          livenessProbe:
            httpGet: { path: /livez, port: 6333 }
          volumeMounts:
            - { name: storage, mountPath: /qdrant/storage }
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
  volumeClaimTemplates:
    - metadata: { name: storage }
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: {{ .Values.persistence.storageClass }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
