# Upstream Qdrant chart plus application backup/access/monitoring resources.
# The Flux HelmRelease pins image digests and fixes authenticated probe paths.
qdrant:
  fullnameOverride: qdrant
  replicaCount: 1
  image:
    repository: qdrant/qdrant
    tag: v1.19.0
  persistence:
    storageClassName: managed-csi
    storageVolumeName: storage
    size: 4Gi
  config:
    cluster:
      enabled: false
    storage:
      on_disk_payload: true
  env:
  - name: QDRANT__SERVICE__API_KEY
    valueFrom:
      secretKeyRef:
        name: qdrant-auth
        key: api-key
  - name: QDRANT__SERVICE__READ_ONLY_API_KEY
    valueFrom:
      secretKeyRef:
        name: qdrant-auth
        key: read-only-api-key
  startupProbe:
    enabled: true
    failureThreshold: 60
  livenessProbe:
    enabled: true
  readinessProbe:
    enabled: true
  podDisruptionBudget:
    enabled: true
    maxUnavailable: 1
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: '1'
      memory: 1Gi
snapshots:
  enabled: true
  schedule: 0 2 * * *
  retentionDays: 30
  accountUrl: ''
  container: snapshots
  prefix: qdrant
  clientId: ''
  image:
    repository: unconfigured.azurecr.io/ingestion-worker
    tag: scaffold
    digest: ''
auth:
  enabled: true
  existingSecret: qdrant-auth
networkPolicy:
  enabled: true
monitoring:
  enabled: true
  labels: {}
