name: qdrant
replicas: 3
image:
  repository: qdrant/qdrant
  tag: v1.19.0
  digest: sha256:057ee3a8da769fe7310dd3537b4dc7583bf87a95ce8ac43c0af5a46bc580d1fc
persistence:
  storageClass: managed-csi-premium
  size: 100Gi
config:
  hnsw_m: 16
  hnsw_ef_construct: 128
  on_disk_payload: true
  replication_factor: 2
  write_consistency_factor: 2
snapshots:
  enabled: true
  schedule: 0 2 * * *
  retentionDays: 30
  accountUrl: https://medwdevsa.blob.core.windows.net
  container: snapshots
  prefix: qdrant
  clientId: ''
  image:
    repository: medwacr.azurecr.io/ingestion-worker
    tag: local
    digest: ''
resources:
  requests:
    cpu: '2'
    memory: 8Gi
  limits:
    cpu: '4'
    memory: 16Gi
podDisruptionBudget:
  minAvailable: 2
auth:
  enabled: true
  existingSecret: qdrant-auth
networkPolicy:
  enabled: true
monitoring:
  # Requires Prometheus Operator CRDs and kube-state-metrics.
  enabled: true
  labels: {}
