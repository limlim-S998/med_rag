# Qdrant, self-hosted in the cluster.
#
# Why in-cluster rather than Qdrant Cloud: EU data residency was a hard client
# requirement and the vectors are derived from client documents, so the store
# had to sit inside the same subscription and network boundary as everything
# else. In-cluster is also what makes per-study collection teardown a one-liner
# we own rather than a support ticket.
name: qdrant
replicas: 3

image:
  repository: qdrant/qdrant
  tag: v1.12.1          # pinned. A vector store that upgrades itself is a
                        # vector store that changes recall without a commit.

persistence:
  # PVC per replica, from the StatefulSet's volumeClaimTemplate. Premium SSD,
  # because HNSW graph traversal is random-access and standard disk latency
  # shows up directly in p99 search time.
  storageClass: managed-csi-premium
  size: 100Gi

config:
  # Defaults for new collections; the per-collection values that matter
  # (m, ef_construct) are set at creation time by qdrant_repo.ensure_collection,
  # because they belong with the code that knows the embedding dimension.
  hnsw_m: 16
  hnsw_ef_construct: 128
  # Vectors on disk with mmap above this threshold. 3072-dim float32 is 12KB a
  # point before quantisation; a large study does not fit comfortably in RAM
  # and paying for a node pool that makes it fit is worse than mmap.
  on_disk_payload: true

snapshots:
  # A PVC is not a backup. A nightly snapshot to Blob is - and it is also the
  # fast path for rebuilding a replica, which beats re-embedding a corpus.
  enabled: true
  schedule: "0 2 * * *"
  destination: https://medwdevsa.blob.core.windows.net/snapshots

resources:
  requests: { cpu: "2", memory: 8Gi }
  limits:   { cpu: "4", memory: 16Gi }

podDisruptionBudget:
  # A rolling node upgrade must not take two of three replicas at once.
  minAvailable: 2
