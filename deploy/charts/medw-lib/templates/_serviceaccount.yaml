{{/*
The ServiceAccount is where workload identity actually lands, and it is worth
knowing that this annotation - not the pod label in _deployment.yaml - is the
half that carries the identity. The label opts the pod into token projection;
this annotation says which managed identity the projected token is for. Miss
either one and DefaultAzureCredential falls through to the next source in its
chain and fails with a message about no credential being available, which
sends people looking in the wrong place.

The value is a client ID. It is not a secret - it is meaningless without the
federated credential in AAD that binds it to exactly this service account in
exactly this namespace. Which is why it can sit in a values file in git.
*/}}
{{- define "medw-lib.serviceaccount" -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.name }}
  annotations:
    {{- toYaml .Values.serviceAccount.annotations | nindent 4 }}
{{- end -}}
