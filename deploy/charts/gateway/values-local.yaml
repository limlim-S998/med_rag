# Local-cluster overrides. NOT a description of any deployed environment.
#
# The defaults in values.yaml describe the target: Azure storage classes, an
# nginx ingress, KEDA-based autoscaling, workload-identity client IDs. Those
# are correct and must stay correct - so a local run overrides them in a
# separate file rather than weakening the defaults. A chart whose defaults
# have been softened to run on a laptop no longer documents production.
#
#   helm install <name> deploy/charts/<name> -n medw -f deploy/charts/<name>/values-local.yaml

image:
  # Images are side-loaded with `minikube image load`, never pulled. Never is
  # the operative word: without this, the kubelet tries a registry it has no
  # credential for and the pod sits in ImagePullBackOff looking like a network
  # problem rather than a policy one.
  repository: medw-gateway
  tag: dev
  pullPolicy: Never

serviceAccount:
  annotations: {}   # no workload identity locally; there is no AAD to federate to

autoscaling:
  # KEDA and the Prometheus operator ARE installed on this cluster now, so the
  # real trigger runs rather than being described. minReplicas 1 to keep the
  # footprint small on a single 8GB node.
  enabled: true
  metric: inflight_requests
  target: 2                 # low, so a handful of concurrent requests scales
  minReplicas: 1
  maxReplicas: 4
  prometheusAddress: http://kps-kube-prometheus-stack-prometheus.monitoring:9090

serviceMonitor:
  enabled: true
  interval: 5s              # this series drives scaling; 30s would be stale

replicas: 1

resources:
  requests: { cpu: 50m, memory: 128Mi }
  limits:   { cpu: 500m, memory: 512Mi }

ingress:
  enabled: true
  className: nginx
  host: medw.local          # add to /etc/hosts, or use `minikube tunnel`
  tls: false                # no cert-manager locally
  annotations:
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"

config:
  # The whole point of the local backend: these pods run with no Azure
  # credential, no endpoint and no cost. Readiness then reflects something
  # true — the in-process dependencies are wired — rather than reporting 503
  # forever because reachability checks against Azure do not exist yet.
  backend: local
