# Writer operations and access decisions. This chart owns NGINX's route table.
name: gateway
env: dev
replicas: 2

image:
  repository: medwdevacr.azurecr.io/gateway
  digest: ""
  sourceSha: unversioned
  tag: scaffold

serviceAccount:
  annotations:
    azure.workload.identity/client-id: ""

config:
  blob_container: "raw"
  auth_tenant_id: ""
  auth_audience: ""
  auth_issuer: ""
  auth_jwks_url: ""
  cosmos_endpoint: ""
  cosmos_database: medw
  blob_account_url: ""
  # Not provisioned. Azure SQL needs an AAD admin principal decision
  # (no AAD group exists on this subscription), so it is deliberately
  # empty rather than pointing at a server that does not exist.
  sql_server: ""
  sql_database: medw

ingress:
  enabled: true
  host: medw-dev.example.com
  className: medw-nginx
  tls: true
  # Idle time between upstream reads, not the total stream duration.
  readTimeout: 300s
  # Both selectors must match. Keep aligned with deploy/nginx-ingress.yaml.
  controller:
    namespace: nginx-ingress
    podLabels:
      app.kubernetes.io/name: nginx-ingress

resources:
  requests: { cpu: 100m, memory: 256Mi }
  limits:   { cpu: 500m, memory: 512Mi }

autoscaling:
  enabled: true
  metric: inflight_requests
  target: 40          # writer operations plus small access-decision requests
  minReplicas: 2
  maxReplicas: 6
