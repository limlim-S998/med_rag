# Durable processing shared by immediate requests and Airflow batches.
name: ingestion-worker
env: dev
replicas: 1

image:
  repository: medwdevacr.azurecr.io/ingestion-worker
  digest: ""
  sourceSha: unversioned
  tag: scaffold

serviceAccount:
  annotations:
    # Blob, Cosmos and index writes plus append-only SQL indexing audit.
    azure.workload.identity/client-id: ""

config:
  cosmos_state_container: "platform-state"
  blob_container: "raw"
  sql_server: ""
  sql_database: "medw"
  embed_deployment: hash-1
  embed_version: hash-1            # must match retrieval's, or the query and
                                    # index vectors are in different spaces
  search_endpoint: ""
  search_index: csr-chunks
  blob_account_url: ""
  cosmos_endpoint: ""
  cosmos_database: medw
  qdrant_url: http://qdrant:6333
  # Pinned classifier version. Changing it re-labels document types, which
  # changes which parser runs. It is a model version axis like any other.
  table_classifier_version: "placeholder-1"

resources:
  requests: { cpu: 500m, memory: 1Gi }
  limits:   { cpu: "2",  memory: 4Gi }

autoscaling:
  # One bounded polling loop; persisted study leases serialize publication.
  enabled: false

# Permit NGINX's authenticated requests; the gateway chart owns public routes.
ingress:
  enabled: true
  controller:
    namespace: nginx-ingress
    podLabels:
      app.kubernetes.io/name: nginx-ingress
