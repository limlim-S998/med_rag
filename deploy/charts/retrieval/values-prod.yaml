env: prod
replicas: 3

image:
  repository: medwprodacr.azurecr.io/retrieval

serviceAccount:
  annotations:
    azure.workload.identity/client-id: "11111111-1111-1111-1111-111111111111"

config:
  aoai_endpoint: https://medwprodaoai.openai.azure.com/
  # Note the model pins are NOT repeated here. Promotion is a PR that moves the
  # dev values up - if prod redefined them, promotion would stop meaning
  # "ship exactly what was tested".

resources:
  requests: { cpu: 500m, memory: 1Gi }
  limits:   { cpu: "2",  memory: 2Gi }
