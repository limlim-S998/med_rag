apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../base
- state-pvc.yaml
patches:
- target:
    kind: HelmRelease
    name: gateway
  patch: "- op: add\n  path: /spec/values\n  value:\n    image:\n      repository:\
    \ medw-gateway\n      tag: dev-1788845240\n      pullPolicy: Never\n    serviceAccount:\n\
    \      annotations: {}\n    autoscaling:\n      enabled: true\n      metric: inflight_requests\n\
    \      target: 2\n      minReplicas: 1\n      maxReplicas: 4\n      prometheusAddress:\
    \ http://kps-kube-prometheus-stack-prometheus.monitoring:9090\n    serviceMonitor:\n\
    \      enabled: true\n      interval: 5s\n    replicas: 1\n    resources:\n  \
    \    requests:\n        cpu: 50m\n        memory: 128Mi\n      limits:\n     \
    \   cpu: 500m\n        memory: 512Mi\n    ingress:\n      enabled: true\n    \
    \  className: nginx\n      host: medw.local\n      tls: false\n      annotations:\n\
    \        nginx.ingress.kubernetes.io/proxy-buffering: 'off'\n        nginx.ingress.kubernetes.io/proxy-read-timeout:\
    \ '300'\n    config:\n      backend: local\n      local_state_path: /data/platform.sqlite3\n\
    \      local_artifact_dir: /data/artifacts\n    env: local\n    localState:\n\
    \      enabled: true\n      existingClaim: medw-local-state\n"
- target:
    kind: HelmRelease
    name: retrieval
  patch: "- op: add\n  path: /spec/values\n  value:\n    image:\n      repository:\
    \ medw-retrieval\n      tag: dev-1788845240\n      pullPolicy: Never\n    serviceAccount:\n\
    \      annotations: {}\n    autoscaling:\n      enabled: true\n      metric: inflight_requests\n\
    \      target: 2\n      minReplicas: 1\n      maxReplicas: 4\n      prometheusAddress:\
    \ http://kps-kube-prometheus-stack-prometheus.monitoring:9090\n    serviceMonitor:\n\
    \      enabled: true\n      interval: 5s\n    replicas: 1\n    resources:\n  \
    \    requests:\n        cpu: 50m\n        memory: 128Mi\n      limits:\n     \
    \   cpu: 500m\n        memory: 512Mi\n    config:\n      backend: local\n    \
    \  local_state_path: /data/platform.sqlite3\n      local_artifact_dir: /data/artifacts\n\
    \    env: local\n    localState:\n      enabled: true\n      existingClaim: medw-local-state\n"
- target:
    kind: HelmRelease
    name: generation
  patch: "- op: add\n  path: /spec/values\n  value:\n    image:\n      repository:\
    \ medw-generation\n      tag: dev-1788845240\n      pullPolicy: Never\n    serviceAccount:\n\
    \      annotations: {}\n    autoscaling:\n      enabled: true\n      metric: inflight_requests\n\
    \      target: 2\n      minReplicas: 1\n      maxReplicas: 4\n      prometheusAddress:\
    \ http://kps-kube-prometheus-stack-prometheus.monitoring:9090\n    serviceMonitor:\n\
    \      enabled: true\n      interval: 5s\n    replicas: 1\n    resources:\n  \
    \    requests:\n        cpu: 50m\n        memory: 128Mi\n      limits:\n     \
    \   cpu: 500m\n        memory: 512Mi\n    config:\n      backend: local\n    \
    \  local_state_path: /data/platform.sqlite3\n      local_artifact_dir: /data/artifacts\n\
    \    env: local\n    localState:\n      enabled: true\n      existingClaim: medw-local-state\n"
- target:
    kind: HelmRelease
    name: ingestion-worker
  patch: "- op: add\n  path: /spec/values\n  value:\n    image:\n      repository:\
    \ medw-ingestion-worker\n      tag: dev-1788845240\n      pullPolicy: Never\n\
    \    serviceAccount:\n      annotations: {}\n    autoscaling:\n      enabled:\
    \ true\n      metric: inflight_requests\n      target: 2\n      minReplicas: 1\n\
    \      maxReplicas: 4\n      prometheusAddress: http://kps-kube-prometheus-stack-prometheus.monitoring:9090\n\
    \    serviceMonitor:\n      enabled: true\n      interval: 5s\n    replicas: 1\n\
    \    resources:\n      requests:\n        cpu: 50m\n        memory: 128Mi\n  \
    \    limits:\n        cpu: 500m\n        memory: 512Mi\n    config:\n      backend:\
    \ local\n      local_state_path: /data/platform.sqlite3\n      local_artifact_dir:\
    \ /data/artifacts\n    env: local\n    localState:\n      enabled: true\n    \
    \  existingClaim: medw-local-state\n"
- target:
    kind: HelmRelease
    name: qdrant
  patch: "- op: add\n  path: /spec/values\n  value:\n    replicas: 1\n    monitoring:\n\
    \      enabled: false\n    snapshots:\n      enabled: false\n    persistence:\n\
    \      storageClass: standard\n      size: 2Gi\n    podDisruptionBudget: null\n\
    \    resources:\n      requests:\n        cpu: 100m\n        memory: 512Mi\n \
    \     limits:\n        cpu: '1'\n        memory: 2Gi\n"
- target:
    kind: HelmRelease
    name: reranker
  patch: "- op: add\n  path: /spec/values\n  value:\n    image:\n      repository:\
    \ medw-reranker\n      tag: dev\n      pullPolicy: Never\n    serviceAccount:\n\
    \      annotations: {}\n    autoscaling:\n      enabled: false\n    replicas:\
    \ 1\n    resources:\n      requests:\n        cpu: 50m\n        memory: 128Mi\n\
    \      limits:\n        cpu: 500m\n        memory: 512Mi\n    env: local\n   \
    \ localState:\n      enabled: true\n      existingClaim: medw-local-state\n  \
    \  config:\n      local_state_path: /data/platform.sqlite3\n      local_artifact_dir:\
    \ /data/artifacts\n"
