- target:
    kind: HelmRelease
    name: qdrant
  patch: |
    - op: add
      path: /spec/values
      value:
        replicas: 1
        monitoring:
          enabled: false
        snapshots:
          enabled: false
        persistence:
          storageClass: standard
          size: 2Gi
        podDisruptionBudget: null
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            cpu: '1'
            memory: 2Gi
        auth:
          enabled: false
        config:
          replication_factor: 1
          write_consistency_factor: 1
- target:
    kind: HelmRelease
    name: reranker
  patch: |
    - op: add
      path: /spec/values
      value:
        image:
          repository: medw-reranker
          tag: dev
          pullPolicy: Never
        serviceAccount:
