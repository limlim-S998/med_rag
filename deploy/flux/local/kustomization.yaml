apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../base
- state-pvc.yaml
patches:
- target:
    kind: HelmRelease
    name: gateway
  patch: |
    - op: add
      path: /spec/values
      value:
        image:
          repository: medw-gateway
          tag: dev-1788845240
          pullPolicy: Never
        serviceAccount:
          annotations: {}
        autoscaling:
          enabled: true
          metric: inflight_requests
          target: 2
          minReplicas: 1
          maxReplicas: 4
          prometheusAddress: http://kps-kube-prometheus-stack-prometheus.monitoring:9090
        serviceMonitor:
          enabled: true
          interval: 5s
        replicas: 1
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        ingress:
          enabled: true
          className: medw-nginx
          host: 192.168.49.2
          tls: false
        config:
          backend: local
          local_state_path: /data/platform.sqlite3
          local_artifact_dir: /data/artifacts
          synthetic_enabled: true
        env: local
        localState:
          enabled: true
          existingClaim: medw-local-state
- target:
    kind: HelmRelease
    name: retrieval
  patch: |
    - op: add
      path: /spec/values
      value:
        image:
          repository: medw-retrieval
          tag: dev-1788845240
          pullPolicy: Never
        serviceAccount:
          annotations: {}
        autoscaling:
          enabled: true
          metric: inflight_requests
          target: 2
          minReplicas: 1
          maxReplicas: 4
          prometheusAddress: http://kps-kube-prometheus-stack-prometheus.monitoring:9090
        serviceMonitor:
