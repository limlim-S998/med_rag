- target:
    kind: HelmRelease
    name: ingestion-worker
  patch: |
    - op: add
      path: /spec/values
      value:
        image:
          repository: medw-ingestion-worker
          tag: dev-1788845240
          pullPolicy: Never
        serviceAccount:
          annotations: {}
        autoscaling:
          enabled: true
          metric: inflight_requests
          target: 2
          minReplicas: 1
          maxReplicas: 4
