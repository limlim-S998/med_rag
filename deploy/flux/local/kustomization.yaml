        config:
          backend: local
          local_state_path: /data/platform.sqlite3
          local_artifact_dir: /data/artifacts
          synthetic_enabled: true
        env: local
        localState:
          enabled: true
          existingClaim: medw-local-state
- target:
    kind: HelmRelease
    name: generation
  patch: |
    - op: add
      path: /spec/values
      value:
        image:
          repository: medw-generation
          tag: dev-1788845240
          pullPolicy: Never
        serviceAccount:
          annotations: {}
        autoscaling:
          enabled: true
          metric: inflight_requests
          target: 2
          minReplicas: 1
          maxReplicas: 4
