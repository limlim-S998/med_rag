apiVersion: v1
kind: Namespace
metadata:
  name: keda
---
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
---
apiVersion: v1
kind: Namespace
metadata:
  name: cert-manager
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: keda
  namespace: flux-system
spec:
  interval: 1h
  url: https://kedacore.github.io/charts
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: prometheus
  namespace: flux-system
spec:
  interval: 1h
  url: https://prometheus-community.github.io/helm-charts
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: cert-manager
  namespace: flux-system
spec:
  interval: 1h
  url: https://charts.jetstack.io
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: keda
  namespace: keda
spec:
  interval: 10m
  timeout: 10m
  releaseName: keda
  chart:
    spec:
      chart: keda
      version: 2.20.2
      sourceRef: {kind: HelmRepository, name: keda, namespace: flux-system}
  install: {remediation: {retries: 3}, crds: CreateReplace}
  upgrade: {remediation: {retries: 3}, crds: CreateReplace}
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prometheus
  namespace: monitoring
spec:
  interval: 10m
  timeout: 10m
  releaseName: prometheus
  chart:
    spec:
      chart: kube-prometheus-stack
      version: 90.0.0
      sourceRef: {kind: HelmRepository, name: prometheus, namespace: flux-system}
  install: {remediation: {retries: 3}, crds: CreateReplace}
  upgrade: {remediation: {retries: 3}, crds: CreateReplace}
  values:
    grafana: {enabled: false}
    alertmanager: {enabled: false}
    prometheus:
      prometheusSpec:
        retention: 24h
        resources:
          requests: {cpu: 100m, memory: 512Mi}
          limits: {memory: 1Gi}
        serviceMonitorSelectorNilUsesHelmValues: false
        ruleSelectorNilUsesHelmValues: false
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: managed-csi
              accessModes: [ReadWriteOnce]
              resources: {requests: {storage: 4Gi}}
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: cert-manager
spec:
  interval: 10m
  timeout: 10m
  releaseName: cert-manager
  chart:
    spec:
      chart: cert-manager
      version: v1.21.2
      sourceRef: {kind: HelmRepository, name: cert-manager, namespace: flux-system}
  install: {remediation: {retries: 3}, crds: CreateReplace}
  upgrade: {remediation: {retries: 3}, crds: CreateReplace}
  values:
    crds: {enabled: true, keep: true}
    prometheus:
      enabled: true
      servicemonitor: {enabled: false}
