apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: airflow
  namespace: medw
spec:
  interval: 5m
  chart:
    spec:
      reconcileStrategy: Revision
      chart: deploy/charts/airflow
      sourceRef:
        kind: GitRepository
        name: medwriter-assist
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
  suspend: true
  timeout: 15m
  dependsOn:
  - name: ingestion-worker
  releaseName: airflow
