      annotations:
        azure.workload.identity/client-id: 98d2d2de-711f-4902-ac81-1ab01dc7b635
    ingress:
      host: medwdev9528fa20.australiaeast.cloudapp.azure.com
      tls: true
    serviceMonitor:
      enabled: true
      interval: 15s
    secretEnv:
    - name: MEDW_APPINSIGHTS_CONNECTION_STRING
