  namespace: medw
spec:
  values:
    env: ${ENVIRONMENT}
    config:
      chat_deployment: scripted-chat
      sql_server: ${SQL_SERVER}
      sql_database: ${SQL_DATABASE}
      cosmos_endpoint: ${COSMOS_URL}
      cosmos_database: ${COSMOS_DATABASE}
      cosmos_state_container: platform-state
      blob_account_url: ${BLOB_URL}
      blob_container: raw
      search_endpoint: ${SEARCH_URL}
      search_index: ${SEARCH_INDEX}
      qdrant_url: http://qdrant:6333
      qdrant_replication_factor: 1
      qdrant_write_consistency_factor: 1
      reranker_url: http://reranker:8000
      retrieval_url: http://retrieval:8000
      auth_tenant_id: ${TENANT_ID}
      auth_audience: ${API_CLIENT_ID}
      auth_issuer: https://login.microsoftonline.com/${TENANT_ID}/v2.0
      auth_jwks_url: https://login.microsoftonline.com/${TENANT_ID}/discovery/v2.0/keys
      batch_principal_id: ${BATCH_PRINCIPAL_ID}
      batch_max_documents: ${BATCH_MAX_DOCUMENTS}
    image:
      repository: ${REGISTRY_HOST}/generation
    serviceAccount:
      annotations:
        azure.workload.identity/client-id: ${GENERATION_CLIENT_ID}
    serviceMonitor:
      enabled: true
      interval: 15s
    secretEnv:
    - name: MEDW_APPINSIGHTS_CONNECTION_STRING
      secretKeyRef:
        name: medw-telemetry
        key: connection-string
    replicas: 1
    autoscaling:
      minReplicas: 1
      maxReplicas: 2
