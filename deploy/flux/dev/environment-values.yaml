apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gateway
  namespace: medw
spec:
  values:
    env: dev
    config:
      cosmos_endpoint: https://medrag325744d5cosmos.documents.azure.com:443/
      cosmos_database: medw-dev
      blob_account_url: https://medwdev9528fa20sa.blob.core.windows.net
      sql_server: medwdev9528fa20sql.database.windows.net
      sql_database: medw
      blob_container: raw
      auth_tenant_id: 721342f3-ed34-4553-93ea-4fbe8f7149eb
      auth_audience: 45819e23-b1b5-4742-bf5e-820b780e095e
      auth_issuer: https://login.microsoftonline.com/721342f3-ed34-4553-93ea-4fbe8f7149eb/v2.0
      auth_jwks_url: https://login.microsoftonline.com/721342f3-ed34-4553-93ea-4fbe8f7149eb/discovery/v2.0/keys
      cosmos_state_container: platform-state
      search_endpoint: https://medrag325744d5search.search.windows.net
      search_index: medw-dev-chunks
      qdrant_url: http://qdrant:6333
      qdrant_replication_factor: 1
      qdrant_write_consistency_factor: 1
      reranker_url: http://reranker:8000
      retrieval_url: http://retrieval:8000
      batch_principal_id: 2405d1e0-a48c-4901-9421-f41df33c77fc
      batch_max_documents: 500
    image:
      repository: medwdev9528fa20acr.azurecr.io/gateway
    serviceAccount:
      annotations:
        azure.workload.identity/client-id: e6703b15-3dee-48f0-9265-51b9df556813
    ingress:
      host: medwdev9528fa20.australiaeast.cloudapp.azure.com
      tls: true
    serviceMonitor:
      enabled: true
      interval: 15s
    secretEnv:
    - name: MEDW_APPINSIGHTS_CONNECTION_STRING
      secretKeyRef:
        name: medw-telemetry
        key: connection-string
    replicas: 1
    autoscaling:
      minReplicas: 1
      maxReplicas: 2
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: '1'
        memory: 1Gi
---
