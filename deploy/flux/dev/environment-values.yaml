      image:
        repository: medwdev9528fa20acr.azurecr.io/ingestion-worker
      enabled: true
      accountUrl: https://medwdev9528fa20sa.blob.core.windows.net
      container: snapshots
      clientId: 6e86d0cf-918d-422d-8be1-743ca4cc0085
    replicas: 1
    persistence:
      storageClass: managed-csi
      size: 8Gi
    config:
      replication_factor: 1
      write_consistency_factor: 1
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: '1'
        memory: 1Gi
    podDisruptionBudget:
      minAvailable: 0
