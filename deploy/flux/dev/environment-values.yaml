# Endpoints and identity IDs come from the cluster ConfigMap exported by Terraform.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gateway
  namespace: medw
spec:
  values:
    env: ${ENVIRONMENT}
    config:
      cosmos_endpoint: ${COSMOS_URL}
      cosmos_database: ${COSMOS_DATABASE}
      blob_account_url: ${BLOB_URL}
      sql_server: ${SQL_SERVER}
      sql_database: ${SQL_DATABASE}
      blob_container: raw
      auth_tenant_id: ${TENANT_ID}
      auth_audience: ${API_CLIENT_ID}
      auth_issuer: https://login.microsoftonline.com/${TENANT_ID}/v2.0
      auth_jwks_url: https://login.microsoftonline.com/${TENANT_ID}/discovery/v2.0/keys
      cosmos_state_container: platform-state
      search_endpoint: ${SEARCH_URL}
      search_index: ${SEARCH_INDEX}
      qdrant_url: http://qdrant:6333
      qdrant_replication_factor: 1
      qdrant_write_consistency_factor: 1
      reranker_url: http://reranker:8000
      retrieval_url: http://retrieval:8000
      batch_principal_id: ${BATCH_PRINCIPAL_ID}
      batch_max_documents: ${BATCH_MAX_DOCUMENTS}
    image:
      repository: ${REGISTRY_HOST}/gateway
    serviceAccount:
      annotations:
        azure.workload.identity/client-id: ${GATEWAY_CLIENT_ID}
    ingress:
      host: ${INGRESS_HOST}
      tls: true
    serviceMonitor:
      enabled: true
      interval: 15s
    secretEnv:
    - name: MEDW_APPINSIGHTS_CONNECTION_STRING
      secretKeyRef:
        name: medw-telemetry
        key: connection-string
    replicas: 1
    autoscaling:
      minReplicas: 1
      maxReplicas: 2
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: '1'
        memory: 1Gi
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: retrieval
  namespace: medw
spec:
  values:
    env: ${ENVIRONMENT}
    config:
      chat_deployment: scripted-chat
      embed_deployment: hash-1
      qdrant_url: http://qdrant:6333
      reranker_url: http://reranker:8000
      search_endpoint: ${SEARCH_URL}
      search_index: ${SEARCH_INDEX}
      cosmos_endpoint: ${COSMOS_URL}
      cosmos_database: ${COSMOS_DATABASE}
      cosmos_state_container: platform-state
      blob_account_url: ${BLOB_URL}
      blob_container: raw
      sql_server: ${SQL_SERVER}
      sql_database: ${SQL_DATABASE}
      qdrant_replication_factor: 1
      qdrant_write_consistency_factor: 1
      retrieval_url: http://retrieval:8000
      auth_tenant_id: ${TENANT_ID}
      auth_audience: ${API_CLIENT_ID}
      auth_issuer: https://login.microsoftonline.com/${TENANT_ID}/v2.0
      auth_jwks_url: https://login.microsoftonline.com/${TENANT_ID}/discovery/v2.0/keys
      batch_principal_id: ${BATCH_PRINCIPAL_ID}
      batch_max_documents: ${BATCH_MAX_DOCUMENTS}
    image:
      repository: ${REGISTRY_HOST}/retrieval
    serviceAccount:
      annotations:
        azure.workload.identity/client-id: ${RETRIEVAL_CLIENT_ID}
    secretEnv:
    - name: MEDW_QDRANT_API_KEY
      secretKeyRef:
        name: qdrant-auth
        key: read-only-api-key
    - name: MEDW_APPINSIGHTS_CONNECTION_STRING
      secretKeyRef:
        name: medw-telemetry
        key: connection-string
    serviceMonitor:
      enabled: true
      interval: 15s
    replicas: 1
    autoscaling:
      minReplicas: 1
      maxReplicas: 2
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        cpu: '1'
        memory: 1Gi
---
