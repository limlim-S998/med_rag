apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: qdrant
  namespace: medw
spec:
  suspend: false
  values:
    qdrant:
      replicaCount: 1
      persistence:
        storageClassName: managed-csi
        size: 4Gi
    snapshots:
      enabled: true
      accountUrl: ${BLOB_URL}
      container: snapshots
      clientId: ${QDRANT_BACKUP_CLIENT_ID}
      image:
        repository: ${REGISTRY_HOST}/ingestion-worker
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: airflow
  namespace: medw
spec:
  values:
    image:
      repository: ${REGISTRY_HOST}/airflow
    airflow:
      images:
        airflow:
          repository: ${REGISTRY_HOST}/airflow
      env:
      - name: MEDW_BATCH_SCHEDULE
        value: ${BATCH_SCHEDULE}
      - name: MEDW_BATCH_TIMEZONE
        value: ${BATCH_TIMEZONE}
      - name: MEDW_INGESTION_URL
        value: http://ingestion-worker:8000
      - name: MEDW_AUTH_AUDIENCE
        value: ${API_CLIENT_ID}
    serviceAccount:
      annotations:
        azure.workload.identity/client-id: ${AIRFLOW_CLIENT_ID}
    backups:
      enabled: true
      accountUrl: ${BLOB_URL}
      clientId: ${AIRFLOW_BACKUP_CLIENT_ID}
      image:
        repository: ${REGISTRY_HOST}/ingestion-worker
