      qdrant_write_consistency_factor: 1
      reranker_url: http://reranker:8000
      retrieval_url: http://retrieval:8000
      batch_principal_id: 70f86e4c-b496-40e0-87a3-f1506dd58df5
      batch_max_documents: 500
    image:
      repository: medwdev9528fa20acr.azurecr.io/gateway
    serviceAccount:
      annotations:
        azure.workload.identity/client-id: 1e21108a-3313-452c-b511-2ad39a152b00
    ingress:
      host: medwdev9528fa20.australiaeast.cloudapp.azure.com
      tls: true
    serviceMonitor:
      enabled: true
      interval: 15s
    secretEnv:
    - name: MEDW_APPINSIGHTS_CONNECTION_STRING
      secretKeyRef:
        name: medw-telemetry
        key: connection-string
    replicas: 1
    autoscaling:
      minReplicas: 1
      maxReplicas: 2
    resources:
      requests:
