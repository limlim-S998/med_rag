apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: qdrant
  namespace: medw
spec:
  suspend: true
  values:
    snapshots:
      image:
        repository: medwdevacr.azurecr.io/ingestion-worker
