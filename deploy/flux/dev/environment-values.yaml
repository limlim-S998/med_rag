apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: qdrant
  namespace: medw
spec:
  suspend: false
  values:
    snapshots:
      image:
        repository: medwdev9528fa20acr.azurecr.io/ingestion-worker
      enabled: true
      accountUrl: https://medwdev9528fa20sa.blob.core.windows.net
      container: snapshots
      clientId: ed6d80c9-7f63-46de-8370-434210221a78
    replicas: 1
    persistence:
      storageClass: managed-csi
      size: 8Gi
    config:
      replication_factor: 1
      write_consistency_factor: 1
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: '1'
        memory: 1Gi
    podDisruptionBudget:
      minAvailable: 0
