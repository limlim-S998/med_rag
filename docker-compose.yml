# Credential-free platform stack; no clinical inference or parsing.
# Default: Qdrant, reranker, retrieval. --profile full adds all five services.
# SQLite state and immutable artifacts survive container restarts in a volume.
x-local: &local
  MEDW_ENV: local
  MEDW_BACKEND: local
  MEDW_SYNTHETIC_ENABLED: "true"
  MEDW_LOCAL_STATE_PATH: /data/platform.sqlite3
  MEDW_LOCAL_ARTIFACT_DIR: /data/artifacts
  MEDW_QDRANT_URL: http://qdrant:6333
  MEDW_RERANKER_URL: http://reranker:8000
  MEDW_RETRIEVAL_URL: http://retrieval:8000
  MEDW_GENERATION_URL: http://generation:8000
  MEDW_INGESTION_URL: http://ingestion-worker:8000

services:
  qdrant:
    image: qdrant/qdrant:v1.12.1
    ports: ["127.0.0.1:${MEDW_QDRANT_PORT:-6333}:6333"]
    volumes: ["qdrant_data:/qdrant/storage"]
  reranker:
    build: {context: ., dockerfile: services/reranker/Dockerfile}
    environment: *local
    ports: ["127.0.0.1:${MEDW_RERANKER_PORT:-8002}:8000"]
  retrieval:
    build: {context: ., dockerfile: services/retrieval/Dockerfile}
    environment: *local
    volumes: ["platform_state:/data"]
    ports: ["127.0.0.1:${MEDW_RETRIEVAL_PORT:-8001}:8000"]
    depends_on: [qdrant, reranker]
  gateway:
    profiles: [full]
    build: {context: ., dockerfile: services/gateway/Dockerfile}
    environment: *local
    volumes: ["platform_state:/data"]
    ports: ["127.0.0.1:${MEDW_GATEWAY_PORT:-8000}:8000"]
    depends_on: [retrieval, generation, ingestion-worker]
  generation:
    profiles: [full]
    build: {context: ., dockerfile: services/generation/Dockerfile}
    environment: *local
    volumes: ["platform_state:/data"]
    ports: ["127.0.0.1:${MEDW_GENERATION_PORT:-8003}:8000"]
  ingestion-worker:
    profiles: [full]
    build: {context: ., dockerfile: services/ingestion_worker/Dockerfile}
    environment: *local
    volumes: ["platform_state:/data"]
    ports: ["127.0.0.1:${MEDW_INGESTION_PORT:-8004}:8000"]
  chroma:
    profiles: [legacy]
    image: chromadb/chroma:0.5.5
    ports: ["127.0.0.1:8005:8000"]

volumes:
  qdrant_data:
  platform_state:
