# The five service images install this package as a wheel from the same source
# checkout as their application. Host development uses an editable install.
# The flat directory layout is mapped explicitly below, including local
# adapters: listing only medw_core would silently omit medw_core.local.
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "medw-core"
version = "0.1.0"
description = "Shared platform contracts, settings, adapters, provenance and telemetry for medwriter-assist."
requires-python = ">=3.11"

# Compatibility requirements for consumers of the library. Service images
# resolve these into exact, hash-checked services/*/requirements.txt locks.
# Azure SDK modules are imported inside their factories so local adapters do
# not create cloud clients. aiohttp supplies the async credential transport.
dependencies = [
    "pydantic>=2",
    "pydantic-settings>=2",
    "azure-identity",
    "aiohttp",
]

[project.optional-dependencies]
aoai = ["openai"]
blob = ["azure-storage-blob"]
search = ["azure-search-documents"]
cosmos = ["azure-cosmos"]
sql = ["sqlalchemy[asyncio]", "aioodbc"]
docintel = ["azure-ai-documentintelligence"]
language = ["azure-ai-textanalytics"]
api = ["fastapi", "httpx", "PyJWT[crypto]"]
telemetry = [
    "opentelemetry-api", "azure-monitor-opentelemetry", "opentelemetry-exporter-prometheus",
]

# Platform composition is service-scoped. Retrieval uses Cosmos for the active
# index-generation record; gateway uses SQL for study authorization; generation
# uses Cosmos/Blob for durable state and evidence as well as SQL for audit.
retrieval = ["medw-core[aoai,search,cosmos,api,telemetry]"]
gateway = ["medw-core[cosmos,blob,sql,api,telemetry]"]
generation = ["medw-core[aoai,blob,cosmos,language,sql,api,telemetry]"]
ingestion = [
    "medw-core[aoai,blob,search,cosmos,docintel,language,sql,api,telemetry]",
]
reranker = ["medw-core[api,telemetry]"]

# Host-only imports retained around the held-back modelling/parser modules.
# These extras do not claim that a trained model or medical parser exists.
ml = ["scikit-learn", "mlflow", "lightgbm"]
parsers = ["llama-index-core"]
dev = [
    "medw-core[ingestion,ml,parsers]",
    "pytest", "ruff", "mypy",
]

[tool.setuptools]
package-dir = { medw_core = "." }
packages = ["medw_core", "medw_core.local"]
